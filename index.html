  <script>
    // =======================================================================
    // 0. SUPABASE CLIENT CONFIG & REST HELPER
    // =======================================================================
    const SUPABASE_URL = 'https://giskluyvwinuyqlgdfuw.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_rInivX8hSrSzWNEeMiMbsw_cNEyJxrh';

    const SB = {
      headers(prefer = '') {
        const h = {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`,
          'Content-Type': 'application/json',
        };
        if (prefer) h['Prefer'] = prefer;
        return h;
      },

      async select(table, query = '') {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}${query ? '?' + query : ''}`, {
          method: 'GET',
          headers: this.headers(),
        });
        if (!res.ok) {
          throw new Error(`Supabase GET ${table} failed: ${res.status}`);
        }
        return await res.json();
      },

      async upsert(table, rows, onConflict = '') {
        const payload = Array.isArray(rows) ? rows : [rows];
        const conflictParam = onConflict ? `?on_conflict=${encodeURIComponent(onConflict)}` : '';
        const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}${conflictParam}`, {
          method: 'POST',
          headers: this.headers('resolution=merge-duplicates,return=representation'),
          body: JSON.stringify(payload),
        });
        if (!res.ok) {
          const txt = await res.text().catch(() => '');
          throw new Error(`Supabase UPSERT ${table} failed: ${res.status} ${txt}`);
        }
        return await res.json().catch(() => []);
      },

      async deleteWhere(table, filterQuery) {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${filterQuery}`, {
          method: 'DELETE',
          headers: this.headers('return=minimal'),
        });
        if (!res.ok) {
          const txt = await res.text().catch(() => '');
          throw new Error(`Supabase DELETE ${table} failed: ${res.status} ${txt}`);
        }
      },
    };

    // =======================================================================
    // 1. EXERCISE CATALOG (63 EXERCISES ACROSS 5 GROUPS - COACH & ASSIGNED ONLY)
    // =======================================================================
    const GROUPS = [
      { id: 'chest', label: 'حرکات سینه' },
      { id: 'shoulder', label: 'سر شانه' },
      { id: 'triceps', label: 'پشت بازو' },
      { id: 'biceps', label: 'جلو بازو' },
      { id: 'back', label: 'زیر بغل' },
    ];

    const RAW_EXERCISES = {
      chest: [
        'پرس سینه هالتر',
        'پرس بالا سینه هالتر',
        'پرس سینه دمبل',
        'پرس بالا سینه دمبل',
        'فلای سینه',
        'کراس اور',
        'قفسه سینه دمبل',
        'کراس دون',
        'پرس سینه دستگاه',
        'پرس بالا سینه دستگاه',
        'زیر سینه هالتر',
        'زیر سینه دمبل',
      ],
      shoulder: [
        'پرس سر شانه دمبل',
        'پرس سر شانه هالتر',
        'نشر جانب دمبل',
        'نشر جانب سیم کش تک دست',
        'نشر جلو دمبل',
        'نشر جلو دمبل چکشی',
        'نشر جلو سیم کش طناب',
        'نشر خم دمبل',
        'نشر خم سیم کش',
        'فیس پول',
        'فلای بک',
        'شراکز سیم کش',
        'شراکز هالتر',
        'شراکز دمبل',
        'پرس سر شانه دستگاه',
      ],
      triceps: [
        'پشت بازو طناب',
        'پشت بازو دیپ',
        'پشت بازو دیپ دستگاه',
        'پشت بازو سیم کش میله',
        'پشت بازو هالتر خوابیده',
        'پشت بازو کیک بک دمبل',
        'پشت بازو کیک بک سیم کش',
        'پشت بازو سیم کش طناب از پایین(دون)',
      ],
      biceps: [
        'جلو بازو دمبل',
        'جلو بازو دمبل چکشی',
        'جلو بازو هالتر',
        'جلو بازو هالتر مچ برعکس',
        'جلو بازو هالتر ایزی',
        'جلو بازو سیم کش میله',
        'جلو بازو سیم کش طناب چکشی',
        'جلو بازو فیگوری سیم کش',
        'جلو بازو دمبل لاری',
        'جلو بازو هالتر لاری',
      ],
      back: [
        'زیر بغل لت از جلو',
        'زیر بغل لت مچ برعکس',
        'زیر بغل لت دست عرض شانه',
        'زیر بغل لت تک دست',
        'زیر بغل قایقی',
        'زیربغل قایقی مچ برعکس',
        'زیر بغل قایقی دست باز',
        'زیر بغل قایقی دست وی',
        'زیر بغل قایقی تک دست',
        'زیر بغل قایقی طناب',
        'زیر بغل اره ای',
        'زیر بغل هالتر خم',
        'زیر بغل دستگاه',
        'لیفت زیر بغل',
        'بارفیکس',
        'بارفیکس کمکی',
        'زیر بغل پول آور سیم کش طناب',
        'زیر بغل پول آور دمبل',
      ],
    };

    function classifyExercise(name, group) {
      const n = name.replace(/\s+/g, '');
      let equip = 'dumbbell';
      if (n.includes('هالتر') || n.includes('ایزی')) equip = 'barbell';
      else if (n.includes('دمبل') || n.includes('اره')) equip = 'dumbbell';
      else if (n.includes('سیمکش') || n.includes('کراس') || n.includes('فیسپول') || n.includes('لت') || n.includes('قایقی') || n.includes('پولآور') || n.includes('طناب')) equip = 'cable';
      else if (n.includes('دستگاه')) equip = 'machine';
      else if (n.includes('بارفیکس') || n.includes('دیپ')) equip = 'bodyweight';

      let arch = 'bicep_curl';
      if (group === 'chest') {
        if (n.includes('بالاسینه')) arch = 'incline_press';
        else if (n.includes('زیرسینه')) arch = 'decline_press';
        else if (n.includes('فلای') || n.includes('قفسه')) arch = 'chest_fly';
        else if (n.includes('کراسدون')) arch = 'cross_down';
        else if (n.includes('کراس')) arch = 'crossover';
        else arch = 'flat_press';
      } else if (group === 'shoulder') {
        if (n.includes('نشرجانب')) arch = 'lateral_raise';
        else if (n.includes('نشرجلو')) arch = 'front_raise';
        else if (n.includes('نشرخم') || n.includes('فلای بک')) arch = 'rear_delt';
        else if (n.includes('فیسپول')) arch = 'face_pull';
        else if (n.includes('شراکز')) arch = 'shrugs';
        else arch = 'overhead_press';
      } else if (group === 'triceps') {
        if (n.includes('دیپ')) arch = 'tricep_dip';
        else if (n.includes('کیکبک')) arch = 'kickback';
        else if (n.includes('خوابیده')) arch = 'skullcrusher';
        else if (n.includes('دون') || n.includes('ازپایین')) arch = 'cable_low_ext';
        else arch = 'tricep_pushdown';
      } else if (group === 'biceps') {
        if (n.includes('چکشی')) arch = 'hammer_curl';
        else if (n.includes('لاری')) arch = 'preacher_curl';
        else if (n.includes('مچبرعکس')) arch = 'reverse_curl';
        else if (n.includes('فیگوری')) arch = 'cable_curl';
        else arch = 'bicep_curl';
      } else if (group === 'back') {
        if (n.includes('بارفیکس')) arch = 'pullup';
        else if (n.includes('لت')) arch = 'lat_pulldown';
        else if (n.includes('پولآور')) arch = 'pullover';
        else if (n.includes('لیفت')) arch = 'deadlift_row';
        else if (n.includes('اره')) arch = 'one_arm_row';
        else if (n.includes('هالترخم')) arch = 'bent_over_row';
        else arch = 'seated_row';
      }

      const phases = (arch === 'lateral_raise' || arch === 'front_raise' || arch === 'bicep_curl' || arch === 'hammer_curl' || arch === 'preacher_curl' || arch === 'reverse_curl' || arch === 'cable_curl' || arch === 'pullup' || arch === 'shrugs')
        ? ['فاز انقباض / بالا بردن', 'فاز کنترل و بازگشت']
        : ['فاز اجرا و فشار اصلی', 'فاز کنترل و بازگشت'];

      const cues = [
        `حفظ وضعیت ثابت ستون فقرات و کنترل کامل دامنه حرکتی در «${name}».`,
        'تنفس منظم: بازدم در لحظه اعمال فشار اصلی و دم در فاز برگشت.',
        'پرهیز از تاب دادن بدن یا استفاده از مومنتوم اضافه برای حفظ تمرکز روی عضله هدف.',
      ];

      return { equip, arch, phases, cues };
    }

    const EXERCISES = [];
    const EX_BY_ID = {};
    const EX_BY_NAME = {};

    GROUPS.forEach((grp) => {
      (RAW_EXERCISES[grp.id] || []).forEach((name) => {
        const id = 'ex_' + (EXERCISES.length + 1);
        const meta = classifyExercise(name, grp.id);
        const ex = {
          id,
          name,
          group: grp.id,
          groupLabel: grp.label,
          ...meta,
        };
        EXERCISES.push(ex);
        EX_BY_ID[id] = ex;
        EX_BY_NAME[name] = ex;
      });
    });

    // =======================================================================
    // 2. STATE MANAGEMENT & PERSISTENCE (SUPABASE + LOCALSTORAGE CACHE)
    // =======================================================================
    const STORAGE_KEY = 'MEHDI_FIT_STATE_V2';

    function uid(prefix = 'id') {
      return prefix + '_' + Math.random().toString(36).slice(2, 10);
    }

    function createInitialState() {
      return {
        theme: 'light',
        currentRoute: 'home',
        session: {
          role: 'guest', // 'guest' | 'coach' | 'student'
          userId: null,
          name: 'مهمان',
        },
        coachProfile: {
          id: 'coach_main',
          name: 'مهدی مرادی',
          title: 'مربی بین‌المللی بدنسازی و فیزیک، متخصص آناتومی و برنامه‌نویسی تمرینی',
          fullBodyPhoto: '',
          bio: 'با بیش از ۱۲ سال سابقه حرفه‌ای در تربیت ورزشکاران فیزیک، بادی‌کلاسیک و بازتوانی حرکتی. تمرکز اصلی من طراحی برنامه‌های علمی، شخصی‌سازی‌شده و کاملاً اصولی بر اساس آناتومی و بیومکانیک بدن هر شاگرد است.',
          credentials: [
            'مربی رسمی فدراسیون بدنسازی و پرورش اندام',
            'تخصص بیومکانیک حرکت و اصلاح ناهنجاری‌های قامتی',
            'تدوین بیش از ۱,۸۰۰ برنامه تخصصی تمرین و تغذیه',
          ],
          stats: {
            experienceYears: '۱۲+',
            activeStudents: '۸۵+',
            programsDesigned: '۱۸۰۰+',
          },
        },
        students: [],
        programs: {}, // { [studentId]: [ { id, title, sortOrder, items: [ { id, exId, sets, reps, rest, note, sortOrder } ] } ] }
        completedItems: {},
        tickets: [],
        ui: {
          coachTab: 'program', // 'program' | 'inbox'
          coachTicketFilter: 'all', // 'all' | 'unread' | 'open' | 'answered'
          coachSelectedStudentId: null,
          coachExpandedDays: {},
          coachExpandedItems: {},
          coachPicker: {
            open: false,
            dayId: null,
            group: 'all',
            search: '',
          },
          studentSelectedDayIndex: 0,
        },
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return createInitialState();
        const parsed = JSON.parse(raw);
        const def = createInitialState();
        return {
          ...def,
          ...parsed,
          session: { ...def.session, ...(parsed.session || {}) },
          coachProfile: {
            ...def.coachProfile,
            ...(parsed.coachProfile || {}),
            stats: { ...def.coachProfile.stats, ...((parsed.coachProfile && parsed.coachProfile.stats) || {}) },
          },
          ui: {
            ...def.ui,
            ...(parsed.ui || {}),
            coachPicker: { ...def.ui.coachPicker, ...((parsed.ui && parsed.ui.coachPicker) || {}) },
          },
        };
      } catch (err) {
        return createInitialState();
      }
    }

    let STATE = loadState();

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
      } catch (err) {
        console.warn('LocalStorage error:', err);
      }
    }

    function applyTheme() {
      const root = document.documentElement;
      if (STATE.theme === 'dark') {
        root.classList.add('dark');
      } else {
        root.classList.remove('dark');
      }
    }
    applyTheme();

    // =======================================================================
    // 3. UI CONTROLLER & SUPABASE SYNC
    // =======================================================================
    const UI = {
      animCleanup: null,
      isSyncing: false,

      escapeHtml(str) {
        return String(str == null ? '' : str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      },

      toFaDigits(val) {
        return String(val).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
      },

      showToast(message, type = 'info') {
        const box = document.getElementById('toastBox');
        if (!box) return;
        const el = document.createElement('div');
        const colors = type === 'error'
          ? 'bg-rose-600 text-white border-rose-500'
          : type === 'success'
          ? 'bg-emerald-600 text-white border-emerald-500'
          : 'bg-slate-900 dark:bg-slate-800 text-white border-slate-700';
        el.className = `pointer-events-auto px-4 py-2.5 rounded-xl border shadow-xl text-xs sm:text-sm font-semibold transition-all duration-300 ${colors}`;
        el.textContent = message;
        box.appendChild(el);
        setTimeout(() => {
          el.style.opacity = '0';
          el.style.transform = 'translateY(8px)';
          setTimeout(() => el.remove(), 300);
        }, 2800);
      },

      // ---------------------------------------------------------------------
      // SUPABASE HYDRATION & PERSISTENCE HELPERS
      // ---------------------------------------------------------------------
      async syncFromSupabase(showFeedback = false) {
        if (this.isSyncing) return;
        this.isSyncing = true;
        this.renderChrome();
        try {
          const [profiles, students, days, items, completed, tickets] = await Promise.all([
            SB.select('coach_profile', 'id=eq.coach_main&limit=1'),
            SB.select('students', 'order=created_at.asc'),
            SB.select('program_days', 'order=sort_order.asc,created_at.asc'),
            SB.select('program_items', 'order=sort_order.asc,created_at.asc'),
            SB.select('completed_items', 'completed=eq.true'),
            SB.select('tickets', 'order=created_at.desc'),
          ]);

          if (Array.isArray(profiles) && profiles[0]) {
            const p = profiles[0];
            STATE.coachProfile = {
              id: p.id || 'coach_main',
              name: p.name || STATE.coachProfile.name,
              title: p.title || STATE.coachProfile.title,
              fullBodyPhoto: p.full_body_photo || '',
              bio: p.bio || STATE.coachProfile.bio,
              credentials: Array.isArray(p.credentials) ? p.credentials : STATE.coachProfile.credentials,
              stats: (p.stats && typeof p.stats === 'object') ? { ...STATE.coachProfile.stats, ...p.stats } : STATE.coachProfile.stats,
            };
            if (STATE.session.role === 'coach') {
              STATE.session.name = STATE.coachProfile.name;
            }
          }

          if (Array.isArray(students)) {
            STATE.students = students.map(s => ({
              id: s.id,
              name: s.name,
              code: s.code,
              goal: s.goal || 'تناسب اندام و افزایش قدرت',
              phone: s.phone || '',
            }));
          }

          const programsMap = {};
          STATE.students.forEach(s => {
            programsMap[s.id] = [];
          });

          const dayLookup = {};
          (Array.isArray(days) ? days : []).forEach(d => {
            if (!programsMap[d.student_id]) programsMap[d.student_id] = [];
            const dayObj = {
              id: d.id,
              studentId: d.student_id,
              title: d.title,
              sortOrder: d.sort_order ?? 0,
              items: [],
            };
            programsMap[d.student_id].push(dayObj);
            dayLookup[d.id] = dayObj;
          });

          (Array.isArray(items) ? items : []).forEach(it => {
            const dayObj = dayLookup[it.day_id];
            if (!dayObj) return;
            dayObj.items.push({
              id: it.id,
              dayId: it.day_id,
              studentId: it.student_id,
              exId: it.ex_id,
              sets: it.sets ?? 3,
              reps: it.reps || '۱۰ تا ۱۲',
              rest: it.rest || '۷۵ ثانیه',
              note: it.note || '',
              sortOrder: it.sort_order ?? 0,
            });
          });

          STATE.programs = programsMap;

          const doneMap = {};
          (Array.isArray(completed) ? completed : []).forEach(c => {
            if (c.completed) doneMap[c.item_id] = true;
          });
          STATE.completedItems = doneMap;

          if (Array.isArray(tickets)) {
            STATE.tickets = tickets.map(t => ({
              id: t.id,
              authorRole: t.author_role || 'student',
              authorId: t.author_id || '',
              authorName: t.author_name || 'کاربر',
              subject: t.subject || '',
              message: t.message || '',
              status: t.status || ((Array.isArray(t.replies) && t.replies.length > 0) ? 'answered' : 'open'),
              isReadByCoach: Boolean(t.is_read_by_coach),
              createdAt: t.created_at_label || '',
              replies: Array.isArray(t.replies) ? t.replies : [],
            }));
          }

          if (!STATE.ui.coachSelectedStudentId && STATE.students.length > 0) {
            STATE.ui.coachSelectedStudentId = STATE.students[0].id;
          }

          saveState();
          if (showFeedback) {
            this.showToast('اطلاعات با پایگاه‌داده همگام‌سازی شد.', 'success');
          }
        } catch (err) {
          console.error('Supabase sync error:', err);
          if (showFeedback) {
            this.showToast('خطا در ارتباط با سرور؛ اطلاعات محلی نمایش داده می‌شود.', 'error');
          }
        } finally {
          this.isSyncing = false;
          this.renderAll();
        }
      },

      async persistCoachProfile() {
        const cp = STATE.coachProfile;
        await SB.upsert('coach_profile', {
          id: cp.id || 'coach_main',
          name: cp.name,
          title: cp.title,
          full_body_photo: cp.fullBodyPhoto || '',
          bio: cp.bio,
          credentials: cp.credentials || [],
          stats: cp.stats || {},
          updated_at: new Date().toISOString(),
        }, 'id');
      },

      async persistStudent(st) {
        await SB.upsert('students', {
          id: st.id,
          name: st.name,
          code: String(st.code),
          goal: st.goal || 'تناسب اندام و افزایش قدرت',
          phone: st.phone || '',
        }, 'id');
      },

      async persistDay(studentId, day, sortOrder = 0) {
        await SB.upsert('program_days', {
          id: day.id,
          student_id: studentId,
          title: day.title,
          sort_order: sortOrder,
        }, 'id');
      },

      async persistItem(studentId, dayId, item, sortOrder = 0) {
        await SB.upsert('program_items', {
          id: item.id,
          day_id: dayId,
          student_id: studentId,
          ex_id: item.exId,
          sets: Number(item.sets) || 3,
          reps: String(item.reps || '۱۰ تا ۱۲'),
          rest: String(item.rest || '۷۵ ثانیه'),
          note: String(item.note || ''),
          sort_order: sortOrder,
        }, 'id');
      },

      async persistCompletedItem(itemId, completed) {
        await SB.upsert('completed_items', {
          item_id: itemId,
          completed: Boolean(completed),
          updated_at: new Date().toISOString(),
        }, 'item_id');
      },

      async persistTicket(tkt) {
        await SB.upsert('tickets', {
          id: tkt.id,
          author_role: tkt.authorRole,
          author_id: tkt.authorId,
          author_name: tkt.authorName,
          subject: tkt.subject,
          message: tkt.message,
          status: tkt.status || 'open',
          is_read_by_coach: Boolean(tkt.isReadByCoach),
          created_at_label: tkt.createdAt || '',
          replies: tkt.replies || [],
          updated_at: new Date().toISOString(),
        }, 'id');
      },

      // ---------------------------------------------------------------------
      // NAVIGATION & DRAWER
      // ---------------------------------------------------------------------
      toggleDrawer(open) {
        const backdrop = document.getElementById('drawerBackdrop');
        const drawer = document.getElementById('navDrawer');
        if (!backdrop || !drawer) return;
        if (open) {
          backdrop.classList.remove('hidden');
          requestAnimationFrame(() => {
            backdrop.classList.remove('opacity-0');
            drawer.classList.remove('translate-x-full');
          });
        } else {
          backdrop.classList.add('opacity-0');
          drawer.classList.add('translate-x-full');
          setTimeout(() => {
            backdrop.classList.add('hidden');
          }, 280);
        }
      },

      toggleTheme() {
        STATE.theme = STATE.theme === 'dark' ? 'light' : 'dark';
        applyTheme();
        saveState();
        this.renderChrome();
      },

      navigate(route) {
        const valid = ['home', 'about', 'contact', 'panel'];
        STATE.currentRoute = valid.includes(route) ? route : 'home';
        saveState();
        this.renderAll();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      },

      logout() {
        if (this.animCleanup) {
          this.animCleanup();
          this.animCleanup = null;
        }
        STATE.session = { role: 'guest', userId: null, name: 'مهمان' };
        if (STATE.currentRoute === 'panel') {
          STATE.currentRoute = 'home';
        }
        saveState();
        this.showToast('از حساب کاربری خارج شدید.');
        this.renderAll();
      },

      // ---------------------------------------------------------------------
      // LOGIN & REGISTER MODAL
      // ---------------------------------------------------------------------

      async handleLoginSubmit(e) {
        e.preventDefault();
        const inp = document.getElementById('loginIdentifier');
        if (!inp) return;
        await this.authenticateIdentifier(inp.value.trim());
      },

      async authenticateIdentifier(rawId) {
        const val = String(rawId || '').trim();
        if (!val) return;

        await this.syncFromSupabase(false);

        const lower = val.toLowerCase();
        if (lower === 'coach' || lower === 'admin' || val === 'مربی' || val === 'ادمین') {
          STATE.session = {
            role: 'coach',
            userId: 'coach_main',
            name: STATE.coachProfile.name,
          };
          STATE.currentRoute = 'panel';
          saveState();
          this.closeModal();
          this.showToast(`خوش آمدید ${STATE.coachProfile.name} (پنل مربی)`, 'success');
          this.renderAll();
          return;
        }

        const matchedStudent = STATE.students.find(
          s => String(s.code).trim() === val || s.name.trim() === val
        );

        if (matchedStudent) {
          STATE.session = {
            role: 'student',
            userId: matchedStudent.id,
            name: matchedStudent.name,
          };
          STATE.ui.studentSelectedDayIndex = 0;
          STATE.currentRoute = 'panel';
          saveState();
          this.closeModal();
          this.showToast(`خوش آمدید ${matchedStudent.name} (پنل شاگرد)`, 'success');
          this.renderAll();
          return;
        }

        this.showToast('شناسه واردشده یافت نشد.', 'error');
      },

      async handleRegisterSubmit(e) {
        e.preventDefault();
        const name = (document.getElementById('regName')?.value || '').trim();
        const code = (document.getElementById('regCode')?.value || '').trim();
        const goal = (document.getElementById('regGoal')?.value || '').trim() || 'تناسب اندام و افزایش قدرت';

        if (!name || !code) return;
        if (STATE.students.some(s => String(s.code).trim() === code)) {
          this.showToast('این کد ورود قبلاً ثبت شده است. کد دیگری انتخاب کنید.', 'error');
          return;
        }

        const newStudent = {
          id: uid('stu'),
          name,
          code,
          goal,
          phone: '',
        };
        STATE.students.push(newStudent);
        STATE.programs[newStudent.id] = [];
        STATE.ui.coachSelectedStudentId = newStudent.id;
        STATE.session = {
          role: 'student',
          userId: newStudent.id,
          name: newStudent.name,
        };
        STATE.currentRoute = 'panel';
        saveState();

        try {
          await this.persistStudent(newStudent);
        } catch (err) {
          console.error('Register persist error:', err);
          this.showToast('ثبت محلی انجام شد؛ خطا در ذخیره روی سرور.', 'error');
        }

        this.closeModal();
        this.showToast(`ثبت‌نام ${name} با موفقیت انجام شد!`, 'success');
        this.renderAll();
      },

      closeModal() {
        if (this.animCleanup) {
          this.animCleanup();
          this.animCleanup = null;
        }
        const root = document.getElementById('modalRoot');
        if (root) {
          root.innerHTML = '';
          root.classList.add('hidden');
          root.classList.remove('flex');
          root.onclick = null;
        }
      },

      getUnreadCoachTicketsCount() {
        return STATE.tickets.filter(t => t.authorRole === 'student' && !t.isReadByCoach).length;
      },

      updateFitnessCalc() {
        const resBox = document.getElementById('fitnessCalcResult');
        if (!resBox) return;

        const w = Math.max(35, Number(document.getElementById('calcWeight')?.value || 78));
        const h = Math.max(120, Number(document.getElementById('calcHeight')?.value || 178));
        const age = Math.max(12, Number(document.getElementById('calcAge')?.value || 26));
        const goal = document.getElementById('calcGoal')?.value || 'maintain';

        const hm = h / 100;
        const bmi = w / (hm * hm);
        let bmiStatus = 'نرمال';
        let bmiBadgeClass = 'text-emerald-600 dark:text-emerald-400';
        if (bmi < 18.5) {
          bmiStatus = 'کم‌وزن';
          bmiBadgeClass = 'text-sky-600 dark:text-sky-400';
        } else if (bmi >= 25 && bmi < 30) {
          bmiStatus = 'اضافه‌وزن';
          bmiBadgeClass = 'text-amber-600 dark:text-amber-400';
        } else if (bmi >= 30) {
          bmiStatus = 'چاقی';
          bmiBadgeClass = 'text-rose-600 dark:text-rose-400';
        }

        const bmr = 10 * w + 6.25 * h - 5 * age + 5;
        let targetKcal = Math.round(bmr * 1.55);
        if (goal === 'bulk') targetKcal += 350;
        if (goal === 'cut') targetKcal -= 400;

        const proteinGrams = Math.round(w * (goal === 'cut' ? 2.0 : 1.8));

        resBox.innerHTML = `
          <div class="rounded-2xl bg-slate-50 dark:bg-slate-800/80 border border-slate-200/80 dark:border-slate-700 p-4 flex flex-col justify-between">
            <div class="text-xs font-bold text-slate-500 dark:text-slate-400">شاخص BMI</div>
            <div class="text-2xl font-black my-1">${this.toFaDigits(bmi.toFixed(1))}</div>
            <div class="text-xs font-bold ${bmiBadgeClass}">${bmiStatus}</div>
          </div>
          <div class="rounded-2xl bg-brand-50 dark:bg-brand-950/40 border border-brand-200/80 dark:border-brand-800/60 p-4 flex flex-col justify-between">
            <div class="text-xs font-bold text-brand-700 dark:text-brand-300">کالری پیشنهادی روزانه</div>
            <div class="text-2xl font-black text-brand-600 dark:text-brand-400 my-1">${this.toFaDigits(targetKcal)}</div>
            <div class="text-xs text-slate-600 dark:text-slate-400">کیلوکالری در روز</div>
          </div>
          <div class="rounded-2xl bg-slate-50 dark:bg-slate-800/80 border border-slate-200/80 dark:border-slate-700 p-4 flex flex-col justify-between">
            <div class="text-xs font-bold text-slate-500 dark:text-slate-400">پروتئین تقریبی</div>
            <div class="text-2xl font-black my-1">${this.toFaDigits(proteinGrams)}g</div>
            <div class="text-xs text-slate-600 dark:text-slate-400">گرم در روز</div>
          </div>
        `;
      },

          STATE.coachProfile.fullBodyPhoto = String(reader.result || '');
          saveState();
          try {
            await this.persistCoachProfile();
            this.showToast('عکس قدی استاد در سرور ذخیره شد.', 'success');

          }
          this.renderMainView();
        };
        reader.readAsDataURL(file);
      },

        STATE.coachProfile.fullBodyPhoto = '';
        saveState();
        try {
          await this.persistCoachProfile();
          this.showToast('عکس قدی استاد حذف شد.');
        } catch (err) {
          console.error(err);
        }
        this.renderMainView();

      async saveCoachProfile(e) {
        e.preventDefault();
        const name = (document.getElementById('editCoachName')?.value || '').trim();
        const title = (document.getElementById('editCoachTitle')?.value || '').trim();
        const bio = (document.getElementById('editCoachBio')?.value || '').trim();
        if (!name || !title || !bio) return;

        STATE.coachProfile.name = name;
        STATE.coachProfile.title = title;
        STATE.coachProfile.bio = bio;
        if (STATE.session.role === 'coach') {
          STATE.session.name = name;
        }
        saveState();

        try {
          await this.persistCoachProfile();
          this.showToast('اطلاعات استاد در پایگاه‌داده به‌روزرسانی شد.', 'success');
        } catch (err) {
          console.error(err);
          this.showToast('ذخیره محلی انجام شد؛ خطا در ارتباط با سرور.', 'error');
        }
        this.renderAll();

      // ROUTE 3: CONTACT & TICKETING
      // ---------------------------------------------------------------------
      renderContact() {
        const isLoggedIn = STATE.session.role === 'coach' || STATE.session.role === 'student';
        const isCoach = STATE.session.role === 'coach';

        const visibleTickets = isCoach
          ? STATE.tickets

          ? STATE.tickets.filter(t => t.authorId === STATE.session.userId)
          : [];

        return `
          <div class="space-y-8">
            <section class="bg-white dark:bg-slate-900 rounded-3xl p-6 sm:p-8 border border-slate-200/80 dark:border-slate-800 shadow-xs space-y-6">
              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-200 dark:border-slate-800 pb-5">
                <div>
                  <span class="inline-block text-xs font-extrabold px-3 py-1 rounded-full bg-sky-100 text-sky-700 dark:bg-sky-900/50 dark:text-sky-300 mb-2">
                    پشتیبانی و ارتباط مستقیم با مربی
                  </span>
                  <h1 class="text-2xl sm:text-3xl font-black">ارتباط با ما و سیستم تیکتینگ</h1>
                  <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-1">
                    ارسال تیکت و مشاهده پاسخ‌ها تنها برای کاربران واردشده یا ثبت‌نام‌شده در سایت فعال است.

                  <div><strong class="text-slate-700 dark:text-slate-200">استاد:</strong> ${UI.escapeHtml(STATE.coachProfile.name)}</div>
                  <div><strong class="text-slate-700 dark:text-slate-200">پاسخگویی:</strong> روزانه در پنل تیکت‌ها</div>
                </div>
              </div>

              ${!isLoggedIn ? `
                <div class="rounded-3xl bg-slate-50 dark:bg-slate-800/70 border-2 border-dashed border-slate-300 dark:border-slate-700 p-8 text-center space-y-4">
                  <div class="w-14 h-14 mx-auto rounded-2xl bg-amber-100 dark:bg-amber-900/50 text-amber-600 dark:text-amber-400 flex items-center justify-center">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                    </svg>
                  </div>
                  <div class="space-y-1.5 max-w-md mx-auto">
                    <h2 class="text-lg font-extrabold text-slate-900 dark:text-white">
                      ارسال تیکت برای کاربران مهمان بسته است
                    </h2>
                    <p class="text-xs sm:text-sm text-slate-600 dark:text-slate-300 leading-relaxed">
                      برای ثبت تیکت، پرسش درباره برنامه تمرینی یا پیگیری پاسخ مربی، ابتدا وارد حساب کاربری خود شوید یا ثبت‌نام کنید.
                    </p>
                  </div>
                  <div class="flex flex-wrap items-center justify-center gap-3 pt-1">
                    <button type="button" onclick="UI.openAuthModal('login')" class="px-5 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-sm font-bold shadow-md transition">
                      ورود به حساب کاربری
                    </button>
                    <button type="button" onclick="UI.openAuthModal('register')" class="px-5 py-2.5 rounded-xl bg-white dark:bg-slate-900 hover:bg-slate-100 dark:hover:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm font-bold transition">
                      ثبت‌نام در سایت
                    </button>
                  </div>
                </div>
              ` : `
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-7 items-start">
                  <form onsubmit="UI.handleTicketCreate(event)" class="lg:col-span-5 bg-slate-50 dark:bg-slate-800/60 rounded-2xl p-5 border border-slate-200/80 dark:border-slate-700 space-y-3.5">
                    <h2 class="text-base font-extrabold">ثبت تیکت جدید</h2>
                    <div class="text-xs text-slate-500 dark:text-slate-400">
                      ارسال‌کننده: <strong class="text-slate-800 dark:text-slate-200">${UI.escapeHtml(STATE.session.name)}</strong>
                    </div>
                    <div>
                      <label class="block text-xs font-bold mb-1">موضوع تیکت</label>
                      <input type="text" id="ticketSubject" required placeholder="مثال: تنظیم برنامه یا پرسش تغذیه‌ای" class="w-full px-3.5 py-2 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-sm focus:outline-none focus:border-brand-500" />
                    </div>
                    <div>
                      <label class="block text-xs font-bold mb-1">متن پیام / تیکت</label>
                      <textarea id="ticketMessage" rows="4" required placeholder="توضیحات خود را بنویسید..." class="w-full px-3.5 py-2 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-sm focus:outline-none focus:border-brand-500"></textarea>
                    </div>
                    <button type="submit" class="w-full py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-sm font-bold shadow-md transition">
                      ارسال تیکت
                    </button>
                  </form>

                  <div class="lg:col-span-7 space-y-3.5">
                    <h2 class="text-base font-extrabold">
                      ${isCoach ? `همه تیکت‌های ثبت‌شده (${UI.toFaDigits(visibleTickets.length)})` : `تیکت‌های من (${UI.toFaDigits(visibleTickets.length)})`}

                    ${visibleTickets.length === 0 ? `
                      <div class="rounded-2xl bg-slate-50 dark:bg-slate-800/50 border border-slate-200/70 dark:border-slate-800 p-6 text-center text-xs sm:text-sm text-slate-500">
                        هنوز تیکتی ثبت نشده است.
                      </div>
                    ` : visibleTickets.map(tkt => this.renderTicketCard(tkt, isCoach, 'contact')).join('')}
                  </div>
                </div>
              `}
            </section>
          </div>
        `;
      },

      renderTicketCard(tkt, isCoach, prefix = 'tkt') {
        const isAnswered = tkt.status === 'answered' || (Array.isArray(tkt.replies) && tkt.replies.length > 0);
        const isUnreadByCoach = isCoach && tkt.authorRole === 'student' && !tkt.isReadByCoach;

        return `
          <div class="rounded-2xl p-4 border space-y-3 transition ${
            isUnreadByCoach
              ? 'bg-amber-50/60 dark:bg-amber-950/20 border-amber-300 dark:border-amber-800/70'
              : 'bg-slate-50 dark:bg-slate-800/60 border-slate-200/80 dark:border-slate-700'
          }">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div class="flex flex-wrap items-center gap-2">
                <span class="font-extrabold text-sm text-slate-900 dark:text-white">${UI.escapeHtml(tkt.subject)}</span>
                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${
                  isAnswered
                    ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300'
                    : 'bg-amber-100 text-amber-700 dark:bg-amber-950 dark:text-amber-300'
                }">
                  ${isAnswered ? 'پاسخ داده شده' : 'در انتظار پاسخ'}
                </span>
                ${isUnreadByCoach ? `
                  <span class="text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-rose-600 text-white">جدید</span>
                ` : ''}
              </div>
              <span class="text-[11px] text-slate-500">${UI.toFaDigits(tkt.createdAt || '')}</span>
            </div>

            <div class="flex items-center justify-between gap-2 text-xs">
              <span class="text-brand-600 dark:text-brand-400 font-semibold">
                ارسال‌کننده: ${UI.escapeHtml(tkt.authorName)} (${tkt.authorRole === 'coach' ? 'مربی' : 'شاگرد'})
              </span>
              ${isUnreadByCoach ? `
                <button type="button" onclick="UI.markTicketRead('${tkt.id}')" class="text-[11px] font-bold text-emerald-600 dark:text-emerald-400 hover:underline">
                  علامت‌گذاری به عنوان خوانده‌شده
                </button>
              ` : ''}
            </div>

            <p class="text-xs sm:text-sm text-slate-700 dark:text-slate-300 leading-relaxed whitespace-pre-line">
              ${UI.escapeHtml(tkt.message)}
            </p>

            ${(tkt.replies && tkt.replies.length > 0) ? `
              <div class="space-y-2 pt-2 border-t border-slate-200/80 dark:border-slate-700">
                ${tkt.replies.map(rep => `
                  <div class="rounded-xl bg-white dark:bg-slate-900 p-3 border border-emerald-200/60 dark:border-emerald-900/40">
                    <div class="flex items-center justify-between text-[11px] font-bold text-emerald-600 dark:text-emerald-400 mb-1">
                      <span>${UI.escapeHtml(rep.sender)}</span>
                      <span>${UI.toFaDigits(rep.time || '')}</span>
                    </div>
                    <p class="text-xs text-slate-700 dark:text-slate-300 leading-relaxed whitespace-pre-line">${UI.escapeHtml(rep.text)}</p>
                  </div>
                `).join('')}
              </div>
            ` : ''}

            ${isCoach ? `
              <form onsubmit="UI.handleTicketReply(event, '${tkt.id}', '${prefix}_${tkt.id}')" class="flex gap-2 pt-1">
                <input type="text" id="${prefix}_${tkt.id}" required placeholder="پاسخ مربی را بنویسید..." class="flex-1 px-3 py-1.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-xs" />
                <button type="submit" class="px-3.5 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold transition">
                  ارسال پاسخ
                </button>
              </form>
            ` : ''}
          </div>
        `;
      },

      async handleTicketCreate(e) {
        e.preventDefault();
        if (STATE.session.role === 'guest') {
          this.showToast('ابتدا وارد حساب کاربری شوید.', 'error');
          return;
        }
        const subject = (document.getElementById('ticketSubject')?.value || '').trim();
        const message = (document.getElementById('ticketMessage')?.value || '').trim();
        if (!subject || !message) return;

        const nowStr = new Date().toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
        const newTicket = {
          id: uid('tkt'),
          authorRole: STATE.session.role,
          authorId: STATE.session.userId,
          authorName: STATE.session.name,
          subject,
          message,
          status: 'open',
          isReadByCoach: STATE.session.role === 'coach',
          createdAt: `امروز - ${nowStr}`,
          replies: [],
        };

        STATE.tickets.unshift(newTicket);
        saveState();

        try {
          await this.persistTicket(newTicket);
          this.showToast('تیکت شما با موفقیت ثبت شد.', 'success');
        } catch (err) {
          console.error(err);
          this.showToast('تیکت به‌صورت محلی ثبت شد؛ خطا در ارتباط با سرور.', 'error');
        }
        this.renderAll();
      },

      async markTicketRead(ticketId) {
        if (STATE.session.role !== 'coach') return;
        const tkt = STATE.tickets.find(t => t.id === ticketId);
        if (!tkt) return;
        tkt.isReadByCoach = true;
        saveState();
        try {
          await this.persistTicket(tkt);
        } catch (err) {
          console.error(err);
        }
        this.renderAll();
      },

      async handleTicketReply(e, ticketId, inputId) {
        e.preventDefault();
        if (STATE.session.role !== 'coach') return;
        const inp = document.getElementById(inputId);
        const text = (inp?.value || '').trim();
        if (!text) return;

        const tkt = STATE.tickets.find(t => t.id === ticketId);
        if (!tkt) return;

        tkt.replies = tkt.replies || [];
        const nowStr = new Date().toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
        tkt.replies.push({
          sender: `${STATE.coachProfile.name} (مربی)`,
          text,
          time: `امروز - ${nowStr}`,
        });
        tkt.status = 'answered';
        tkt.isReadByCoach = true;
        saveState();

        try {
          await this.persistTicket(tkt);
          this.showToast('پاسخ تیکت در سرور ثبت شد.', 'success');
        } catch (err) {
          console.error(err);
          this.showToast('پاسخ محلی ثبت شد؛ خطا در ارتباط با سرور.', 'error');
        }
        this.renderAll();
      },

      // ---------------------------------------------------------------------
      // ROUTE 4: USER PANEL
      // ---------------------------------------------------------------------
      renderPanel() {
        if (STATE.session.role === 'guest') {
          return `
            <div class="bg-white dark:bg-slate-900 rounded-3xl p-8 border border-slate-200/80 dark:border-slate-800 text-center space-y-4 max-w-xl mx-auto my-6">

              <p class="text-xs sm:text-sm text-slate-600 dark:text-slate-400 leading-relaxed">
                لطفاً وارد شوید تا سیستم نقش شما را به عنوان <strong>مربی</strong> یا <strong>شاگرد</strong> تشخیص دهد و پنل مربوطه باز شود.
              </p>
              <button type="button" onclick="UI.openAuthModal('login')" class="px-6 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-sm font-bold shadow-md transition">
                ورود به حساب کاربری
              </button>
            </div>
          `;
        }

        if (STATE.session.role === 'coach') {
          return this.renderCoachPanel();
        }
        return this.renderStudentPanel();
      },

      // ---------------------------------------------------------------------
      // COACH PANEL (PROGRAM BUILDER + COACH TICKET INBOX)
      // ---------------------------------------------------------------------
      setCoachTab(tab) {
        STATE.ui.coachTab = tab === 'inbox' ? 'inbox' : 'program';
        if (tab === 'inbox') {
          // Automatically mark unread student tickets as read when opening inbox
          let changed = false;
          STATE.tickets.forEach(t => {
            if (t.authorRole === 'student' && !t.isReadByCoach) {
              t.isReadByCoach = true;
              changed = true;
              this.persistTicket(t).catch(err => console.error(err));
            }
          });
          if (changed) saveState();
        }
        this.renderAll();
      },

      setCoachTicketFilter(filter) {
        STATE.ui.coachTicketFilter = filter;
        this.renderMainView();
      },

                      : 'text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white'

                    activeTab === 'inbox'
                      ? 'bg-white dark:bg-slate-900 text-brand-600 shadow-xs'
                      : 'text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white'
                  }"
                >
                  <span>صندوق دریافت تیکت‌ها (${this.toFaDigits(studentTicketsCount)})</span>
                  ${unreadCount > 0 ? `
                    <span class="px-2 py-0.5 rounded-full bg-rose-600 text-white text-[10px] font-extrabold">${this.toFaDigits(unreadCount)}</span>
                  ` : ''}
                </button>
              </div>
            </div>

            ${activeTab === 'inbox' ? this.renderCoachTicketInbox() : `
              <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">

                    <h2 class="font-extrabold text-base">لیست شاگردان (${this.toFaDigits(students.length)})</h2>
                  </div>

                  <div class="space-y-2 max-h-80 overflow-y-auto pr-1">
                    ${students.length === 0 ? `
                      <div class="text-xs text-slate-500 text-center py-4">هنوز شاگردی ثبت نشده است.</div>
                    ` : students.map(st => {

                        <button
                          type="button"
                          onclick="UI.selectCoachStudent('${st.id}')"
                          class="w-full text-right p-3 rounded-2xl border transition flex items-center justify-between gap-2 ${
                            active
                              ? 'bg-brand-50 dark:bg-brand-950/50 border-brand-500 text-slate-900 dark:text-white'
                              : 'bg-slate-50 dark:bg-slate-800/60 border-slate-200/70 dark:border-slate-700/70 hover:border-brand-300'

                        >

                            <div class="font-bold text-sm truncate">${UI.escapeHtml(st.name)}</div>

                      `;

                  <!-- Add New Student Form -->

      renderCoachTicketInbox() {
        const filter = STATE.ui.coachTicketFilter || 'all';
        const allStudentTickets = STATE.tickets.filter(t => t.authorRole === 'student');

        const filtered = allStudentTickets.filter(t => {
          const answered = t.status === 'answered' || (Array.isArray(t.replies) && t.replies.length > 0);
          if (filter === 'open') return !answered;
          if (filter === 'answered') return answered;
          return true;
        });

        const openCount = allStudentTickets.filter(t => !(t.status === 'answered' || (t.replies && t.replies.length > 0))).length;
        const answeredCount = allStudentTickets.length - openCount;

        return `
          <section class="bg-white dark:bg-slate-900 rounded-3xl p-5 sm:p-6 border border-slate-200/80 dark:border-slate-800 space-y-5">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-200 dark:border-slate-800 pb-4">
              <div>
                <h2 class="text-lg sm:text-xl font-black">صندوق دریافت تیکت‌های شاگردان</h2>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
                  مشاهده پیام‌های ارسال‌شده توسط شاگردان و ثبت پاسخ مستقیم مربی
                </p>
              </div>

              <div class="flex flex-wrap items-center gap-1.5">
                <button type="button" onclick="UI.setCoachTicketFilter('all')" class="px-3 py-1.5 rounded-xl text-xs font-bold transition ${filter === 'all' ? 'bg-brand-600 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'}">
                  همه (${this.toFaDigits(allStudentTickets.length)})
                </button>
                <button type="button" onclick="UI.setCoachTicketFilter('open')" class="px-3 py-1.5 rounded-xl text-xs font-bold transition ${filter === 'open' ? 'bg-amber-600 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'}">
                  در انتظار پاسخ (${this.toFaDigits(openCount)})
                </button>
                <button type="button" onclick="UI.setCoachTicketFilter('answered')" class="px-3 py-1.5 rounded-xl text-xs font-bold transition ${filter === 'answered' ? 'bg-emerald-600 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'}">
                  پاسخ داده‌شده (${this.toFaDigits(answeredCount)})
                </button>
              </div>
            </div>

            ${filtered.length === 0 ? `
              <div class="rounded-2xl bg-slate-50 dark:bg-slate-800/50 border border-dashed border-slate-300 dark:border-slate-700 p-8 text-center text-xs sm:text-sm text-slate-500">
                تیکتی در این دسته‌بندی وجود ندارد.
              </div>
            ` : `
              <div class="space-y-3.5">
                ${filtered.map(tkt => this.renderTicketCard(tkt, true, 'inbox_reply')).join('')}
              </div>
            `}
          </section>
        `;
      },

      selectCoachStudent(studentId) {
        STATE.ui.coachSelectedStudentId = studentId;
        const days = STATE.programs[studentId] || [];
        if (days.length > 0 && !Object.keys(STATE.ui.coachExpandedDays).some(k => days.some(d => d.id === k))) {
          STATE.ui.coachExpandedDays[days[0].id] = true;
        }
        saveState();
        this.renderMainView();
      },

      toggleCoachDay(dayId) {
        STATE.ui.coachExpandedDays[dayId] = !STATE.ui.coachExpandedDays[dayId];
        saveState();
        this.renderMainView();
      },

      setAllDaysExpanded(expand) {
        const sid = STATE.ui.coachSelectedStudentId;
        const days = STATE.programs[sid] || [];
        days.forEach(d => {
          STATE.ui.coachExpandedDays[d.id] = expand;
        });
        saveState();
        this.renderMainView();
      },

      toggleCoachItem(itemId) {
        STATE.ui.coachExpandedItems[itemId] = !STATE.ui.coachExpandedItems[itemId];
        saveState();
        this.renderMainView();
      },

      async handleAddStudent(e) {
        e.preventDefault();
        const name = (document.getElementById('newStuName')?.value || '').trim();
        const code = (document.getElementById('newStuCode')?.value || '').trim();
        const goal = (document.getElementById('newStuGoal')?.value || '').trim() || 'برنامه عمومی و فرم‌دهی';
        if (!name || !code) return;

        if (STATE.students.some(s => String(s.code).trim() === code)) {
          this.showToast('کد ورود تکراری است. کد دیگری وارد کنید.', 'error');
          return;
        }

        const newStudent = { id: uid('stu'), name, code, goal, phone: '' };
        const firstDay = { id: uid('day'), title: 'روز اول تمرینی', items: [] };
        STATE.students.push(newStudent);
        STATE.programs[newStudent.id] = [firstDay];
        STATE.ui.coachSelectedStudentId = newStudent.id;
        STATE.ui.coachExpandedDays[firstDay.id] = true;
        saveState();

        try {
          await this.persistStudent(newStudent);
          await this.persistDay(newStudent.id, firstDay, 0);
          this.showToast(`شاگرد «${name}» در سرور ثبت شد.`, 'success');
        } catch (err) {
          console.error(err);
          this.showToast('ثبت محلی انجام شد؛ خطا در ارتباط با سرور.', 'error');
        }
        this.renderMainView();
      },

      async deleteStudent(studentId) {
        const st = STATE.students.find(s => s.id === studentId);
        if (!st) return;
        STATE.students = STATE.students.filter(s => s.id !== studentId);
        delete STATE.programs[studentId];
        if (STATE.ui.coachSelectedStudentId === studentId) {
          STATE.ui.coachSelectedStudentId = STATE.students[0] ? STATE.students[0].id : null;
        }
        saveState();

        try {
          await SB.deleteWhere('students', `id=eq.${encodeURIComponent(studentId)}`);
          this.showToast(`شاگرد «${st.name}» حذف شد.`);
        } catch (err) {
          console.error(err);
          this.showToast('حذف محلی انجام شد؛ خطا در حذف از سرور.', 'error');
        }
        this.renderMainView();
      },

      async addProgramDay() {
        const sid = STATE.ui.coachSelectedStudentId;
        if (!sid) return;
        const list = STATE.programs[sid] || [];
        const newDay = {
          id: uid('day'),
          title: `روز ${this.toFaDigits(list.length + 1)} تمرینی`,
          items: [],
        };
        const sortOrder = list.length;
        list.push(newDay);
        STATE.programs[sid] = list;
        STATE.ui.coachExpandedDays[newDay.id] = true;
        saveState();

        try {
          await this.persistDay(sid, newDay, sortOrder);
          this.showToast('روز تمرینی جدید در سرور ثبت شد.', 'success');
        } catch (err) {
          console.error(err);
          this.showToast('ثبت محلی انجام شد؛ خطا در ارتباط با سرور.', 'error');
        }
        this.renderMainView();
      },

      async deleteProgramDay(dayId) {
        const sid = STATE.ui.coachSelectedStudentId;
        if (!sid) return;
        STATE.programs[sid] = (STATE.programs[sid] || []).filter(d => d.id !== dayId);
        delete STATE.ui.coachExpandedDays[dayId];
        saveState();

        try {
          await SB.deleteWhere('program_days', `id=eq.${encodeURIComponent(dayId)}`);
          this.showToast('روز تمرینی حذف شد.');
        } catch (err) {
          console.error(err);
          this.showToast('حذف محلی انجام شد؛ خطا در حذف از سرور.', 'error');
        }
        this.renderMainView();
      },

      async updateDayTitle(dayId, title) {
        const sid = STATE.ui.coachSelectedStudentId;
        const days = STATE.programs[sid] || [];
        const idx = days.findIndex(d => d.id === dayId);
        if (idx < 0) return;
        days[idx].title = title.trim() || days[idx].title;
        saveState();
        try {
          await this.persistDay(sid, days[idx], idx);
        } catch (err) {
          console.error(err);
        }
        this.renderMainView();
      },

      async addExerciseToDay(dayId, exId) {
        const sid = STATE.ui.coachSelectedStudentId;
        const day = (STATE.programs[sid] || []).find(d => d.id === dayId);
        const ex = EX_BY_ID[exId];
        if (!day || !ex) return;

        const newItem = {
          id: uid('it'),
          exId: ex.id,
          sets: 3,
          reps: '۱۰ تا ۱۲',
          rest: '۷۵ ثانیه',
          note: '',
        };
        const sortOrder = day.items.length;
        day.items.push(newItem);
        STATE.ui.coachExpandedDays[dayId] = true;
        STATE.ui.coachExpandedItems[newItem.id] = true;
        saveState();

        try {
          await this.persistItem(sid, dayId, newItem, sortOrder);
          this.showToast(`«${ex.name}» به برنامه اضافه شد.`, 'success');
        } catch (err) {
          console.error(err);
          this.showToast('افزودن محلی انجام شد؛ خطا در ارتباط با سرور.', 'error');
        }
        this.renderMainView();
      },

      async moveExerciseItem(dayId, itemId, dir) {
        const sid = STATE.ui.coachSelectedStudentId;
        const day = (STATE.programs[sid] || []).find(d => d.id === dayId);
        if (!day) return;
        const idx = day.items.findIndex(x => x.id === itemId);
        const targetIdx = idx + dir;
        if (idx < 0 || targetIdx < 0 || targetIdx >= day.items.length) return;
        const tmp = day.items[idx];
        day.items[idx] = day.items[targetIdx];
        day.items[targetIdx] = tmp;
        saveState();

        try {
          await Promise.all([
            this.persistItem(sid, dayId, day.items[idx], idx),
            this.persistItem(sid, dayId, day.items[targetIdx], targetIdx),
          ]);
        } catch (err) {
          console.error(err);
        }
        this.renderMainView();
      },

      async deleteExerciseItem(dayId, itemId) {
        const sid = STATE.ui.coachSelectedStudentId;
        const day = (STATE.programs[sid] || []).find(d => d.id === dayId);
        if (!day) return;
        day.items = day.items.filter(x => x.id !== itemId);
        delete STATE.ui.coachExpandedItems[itemId];
        saveState();

        try {
          await SB.deleteWhere('program_items', `id=eq.${encodeURIComponent(itemId)}`);
          this.showToast('تمرین حذف شد.');
        } catch (err) {
          console.error(err);
        }
        this.renderMainView();
      },

      async updateExerciseItem(dayId, itemId, field, value) {
        const sid = STATE.ui.coachSelectedStudentId;
        const day = (STATE.programs[sid] || []).find(d => d.id === dayId);
        const idx = day ? day.items.findIndex(x => x.id === itemId) : -1;
        if (!day || idx < 0) return;
        day.items[idx][field] = value;
        saveState();

        try {
          await this.persistItem(sid, dayId, day.items[idx], idx);
        } catch (err) {
          console.error(err);
        }
      },

      // ---------------------------------------------------------------------
      // COACH-ONLY EXERCISE PICKER MODAL (63 EXERCISES)
      // ---------------------------------------------------------------------

        if (STATE.session.role !== 'coach') {
          this.showToast('فقط مربی به کتابخانه انتخاب حرکات دسترسی دارد.', 'error');
          return;
        }
        STATE.ui.coachPicker = {
          open: true,
          dayId,
          group: 'all',
          search: '',
        };
        this.renderExercisePickerModal();
      },

      setPickerGroup(groupId) {
        STATE.ui.coachPicker.group = groupId;
        this.renderExercisePickerModal();
      },

      setPickerSearch(q) {
        STATE.ui.coachPicker.search = q;
        this.updatePickerListOnly();
      },

      getFilteredPickerExercises() {
        const q = (STATE.ui.coachPicker.search || '').trim().toLowerCase();
        const grp = STATE.ui.coachPicker.group || 'all';
        return EXERCISES.filter(ex => {
          const matchGroup = grp === 'all' || ex.group === grp;

      async toggleItemDone(itemId) {
        const nextVal = !STATE.completedItems[itemId];
        STATE.completedItems[itemId] = nextVal;
        saveState();
        this.renderMainView();
        try {
          await this.persistCompletedItem(itemId, nextVal);
        } catch (err) {
          console.error(err);
        }
      },

          this.animCleanup();
          this.animCleanup = null;
        }

        let assignedItem = null;
        if (itemId) {
          Object.values(STATE.programs).forEach(days => {

              const found = (d.items || []).find(it => it.id === itemId);
              if (found) assignedItem = found;
            });
          });
        }

        const root = document.getElementById('modalRoot');
        root.innerHTML = `

            ` : ''}

              <div class="text-xs font-extrabold text-slate-700 dark:text-slate-300">نکات اجرایی حرکت:</div>
              <ul class="space-y-1 text-xs text-slate-600 dark:text-slate-400 list-disc list-inside">
                ${meta.cues.map(c => `<li>${UI.escapeHtml(c)}</li>`).join('')}
              </ul>
            </div>
          </div>
        `;

        root.classList.remove('hidden');
        root.classList.add('flex');
        root.onclick = () => this.closeModal();
